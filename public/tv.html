<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Layar Antrian - Klinik Sehat</title>
<link rel="icon" href="assets/himatif.png" type="image/png">
<style>
*{box-sizing:border-box}
body{margin:0;background:#071c21;color:#e6f2f1;font:16px/1.4 "Plus Jakarta Sans",system-ui,sans-serif;min-height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:16px;padding:14px 24px;background:#0c2a31;border-bottom:2px solid #0f8b8d}
header img{width:52px;height:52px}
header h1{margin:0;font-size:clamp(20px,3vw,34px)}header small{opacity:.7;display:block;font-size:14px}
.jam{margin-left:auto;text-align:right}.jam b{font-size:clamp(24px,4vw,44px);font-variant-numeric:tabular-nums;display:block;line-height:1}
.jam span{opacity:.75;font-size:14px}
main{flex:1;display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:18px;padding:20px 24px}
.kartu{background:#0c2a31;border:1px solid #1b4b53;border-radius:18px;padding:20px;display:flex;flex-direction:column;text-align:center}
.kartu.libur{opacity:.45}
.kartu h2{margin:0;font-size:clamp(20px,2.4vw,28px)}.kartu .sp{color:#7fe0d3;margin-bottom:8px}
.kartu small{opacity:.75;letter-spacing:.12em;text-transform:uppercase;font-size:12px}
.no{font-size:clamp(64px,11vw,150px);font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;color:#fff}
.no.kosong{color:#2f6068}
.kartu.baru{animation:baru 1.6s ease-out;border-color:#7fe0d3}
@keyframes baru{0%,40%,80%{box-shadow:0 0 0 0 #7fe0d3cc;background:#0f5560}20%,60%,100%{box-shadow:0 0 40px 6px #7fe0d300}}
.next{margin-top:auto;padding-top:14px;border-top:1px solid #1b4b53}
.next span{display:inline-block;margin:4px;padding:4px 14px;border-radius:20px;background:#12414a;font-size:clamp(16px,2vw,24px);font-weight:600}
.menunggu{margin-top:8px;opacity:.8}
#izin{position:fixed;inset:auto 0 0 0;background:#e8a33d;color:#222;text-align:center;padding:14px;font-weight:600;cursor:pointer;z-index:5}
#status{position:fixed;right:12px;bottom:12px;font-size:12px;opacity:.6}
footer{padding:8px 24px;text-align:center;opacity:.55;font-size:13px}
@media (prefers-reduced-motion:reduce){.kartu.baru{animation:none}}
</style>
</head>
<body>
<header><img src="assets/logo.svg" alt="Logo"><div><h1>Klinik Sehat</h1><small>Prodi Teknologi Informasi - Layar Antrian</small></div><div class="jam"><b id="jam">--:--:--</b><span id="tgl"></span></div></header>
<main id="isi"><p>Memuat data antrian...</p></main>
<footer>Mohon menunggu hingga nomor Anda dipanggil. Layar ini hanya menampilkan nomor antrian.</footer>
<div id="izin" onclick="aktifkanSuara()">Ketuk di sini untuk mengaktifkan suara panggilan</div>
<div id="status"></div>
<script src="js/tv.js"></script>
</body>
</html>
